<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おはじきサッカースタジアム</title>
<style>
  :root{ --bg:#ffffff; --fg:#1d1c1a; --mut:#5f5a54; --line:#e2ddd6; --acc:#3f6247; }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#161816; --fg:#e8e4dc; --mut:#a49e95; --line:#33372f; --acc:#82ae8c; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",YuGothic,"Noto Sans JP",system-ui,sans-serif;
    line-height:1.85; font-size:16px; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:640px; margin:0 auto; padding:72px 20px 96px}
  h1{font-size:28px; margin:0 0 10px; letter-spacing:-.01em}
  .sub{color:var(--mut); margin:0 0 40px}
  ul{list-style:none; margin:0; padding:0; border-top:1px solid var(--line)}
  li{border-bottom:1px solid var(--line)}
  li a{display:block; padding:18px 4px; color:var(--fg); text-decoration:none; font-weight:600}
  li a:hover,li a:focus-visible{color:var(--acc)}
  li a:focus-visible{outline:2px solid var(--acc); outline-offset:2px}
  footer{margin-top:48px; color:var(--mut); font-size:14px}
  a{color:var(--acc)}
</style>
</head>
<body>
<div class="wrap">

<h1>おはじきサッカースタジアム</h1>
<p class="sub">コマを指ではじいて戦う、ターン制のボードサッカーゲームです。</p>

</ul>

<footer>

</footer>

</div>
</body>
</html>
